<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHT · QUANT TRADER</title>
  <link rel="icon" type="image/png" href="assets/icon48.png" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    html, body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 36px 20px;
      user-select: none;
      overflow-x: hidden;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      max-width: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    /* WHT en bloque ASCII de fórmulas matemáticas mutando */
    #whtAscii {
      font-family: var(--font-main);
      font-size: clamp(0.52rem, 3.3vw, 1.15rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: clamp(0.02em, 0.32vw, 0.12em);
      color: var(--text-muted);
      white-space: pre;
      text-align: center;
      display: inline-block;
      max-width: 100%;
    }

    /* QUANT TRADER: Texto sólido, fijo, sin animación */
    .brand-sub {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.38em;
      padding-left: 0.38em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
    }

    .section-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      color: var(--text-dim);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 10px;
    }

    .catalog-wrap {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 22px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-family: var(--font-main);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Categoría FUND en verde */
    .filter-btn.fund-tab {
      color: rgba(25, 255, 140, 0.78);
    }
    .filter-btn.fund-tab:hover {
      color: #19ff8c;
    }
    .filter-btn.fund-tab.active {
      color: #19ff8c;
      border-color: rgba(25, 255, 140, 0.55);
      background: rgba(25, 255, 140, 0.08);
    }

    .projects-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      align-content: flex-start;
      min-height: 70px;
    }

    .project-link {
      color: var(--text);
      text-decoration: none;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid var(--border-strong);
      padding: 6px 14px;
      border-radius: 4px;
      transition: all 0.2s ease;
      background: var(--bg);
    }

    .project-link:hover {
      color: var(--bg);
      background: var(--text);
      border-color: var(--text);
    }

    /* Botón Hack Rojo */
    .project-link.htv-btn {
      color: #ff3352;
      border-color: rgba(229, 25, 55, 0.65);
    }

    .project-link.htv-btn:hover {
      color: #ffffff;
      background: var(--accent-alt);
      border-color: var(--accent-alt);
      box-shadow: 0 0 18px rgba(229, 25, 55, 0.45);
    }

    /* Botón Fund Verde */
    .project-link.fund-btn {
      color: #19ff8c;
      border-color: rgba(25, 255, 140, 0.65);
    }

    .project-link.fund-btn:hover {
      color: #000000;
      background: #19ff8c;
      border-color: #19ff8c;
      box-shadow: 0 0 18px rgba(25, 255, 140, 0.42);
    }

    .empty-cat {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      text-transform: uppercase;
      padding: 8px 0;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 26px;
    }

    .social-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .social-links a:hover {
      color: var(--text);
      border-bottom-color: var(--border-strong);
    }

    .perf-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .perf-label {
      color: var(--text-dim);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .perf-group a {
      color: var(--text-muted);
      font-weight: 700;
      padding: 2px 4px;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .perf-group a:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .social-links a.sigma-link {
      color: #19ff8c;
      font-weight: 700;
    }

    .social-links a.sigma-link:hover {
      color: #6bffb8;
      border-bottom-color: #19ff8c;
    }

    .sep {
      color: var(--border);
      font-size: 0.65rem;
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR CENTRAL: QUANT TRADER ARRIBA Y WHT MUTANDO EN GRIS ABAJO -->
  <a class="brand-container" href="index.html" title="Inicio WHT">
    <div class="brand-sub">QUANT TRADER</div>
    <pre id="whtAscii"></pre>
  </a>

  <!-- CATÁLOGO: FILTROS + PROYECTOS / ACCESOS DIRECTOS -->
  <section class="catalog-wrap" aria-label="Proyectos y categorías">
    <div id="filterBar" class="filter-bar"></div>
    <div id="projectsGroup" class="projects-group"></div>
  </section>

  <!-- ENLACES SOCIALES -->
  <div class="social-links">
    <a href="https://www.youtube.com/@whitehatrader" target="_blank" rel="noopener noreferrer">YouTube</a>
    <span class="sep">·</span>
    <a href="https://www.instagram.com/whitehatrader/" target="_blank" rel="noopener noreferrer">Instagram</a>
    <span class="sep">·</span>
    <a href="https://t.me/Whitehatrader" target="_blank" rel="noopener noreferrer">Telegram</a>
    <span class="sep">·</span>
    <span class="perf-group">
      <span class="perf-label">Performance</span>
      <a href="https://ctrader.com/es/profile/Whitehatrader" target="_blank" rel="noopener noreferrer" title="cTrader Profile I">I</a>
      <span class="sep" style="opacity:0.35">·</span>
      <a href="https://community.ctrader.com/u/MATUSWHT/" target="_blank" rel="noopener noreferrer" title="cTrader Profile II">II</a>
    </span>
    <span class="sep">·</span>
    <a class="sigma-link" href="sigma-ii/" title="Fondo de Inversión Privado WHT SIGMA II">SIGMA II</a>
  </div>

  <script src="assets/catalog.js"></script>
  <script>
    /* --- Renderizado de Destacados (por defecto) y Filtros por categoría --- */
    const filterBar = document.getElementById("filterBar");
    const projectsGroup = document.getElementById("projectsGroup");
    const categories = window.WHT_CATEGORIES || [];
    const catalog = window.WHT_CATALOG || [];
    let activeFilter = null; // null = muestra destacados al entrar

    function renderFilters() {
      filterBar.innerHTML = categories.map(cat => {
        const extra = cat.accent === "green" ? " fund-tab" : "";
        const act = cat.id === activeFilter ? " active" : "";
        return `<button class="filter-btn${extra}${act}" data-cat="${cat.id}">${cat.label}</button>`;
      }).join("");

      filterBar.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const cat = btn.dataset.cat;
          if (cat === "blog") {
            window.location.href = "blog/";
            return;
          }
          activeFilter = activeFilter === cat ? null : cat;
          renderFilters();
          renderProjects();
        });
      });
    }

    function renderProjects() {
      const list = activeFilter === null
        ? catalog.filter(p => p.featured)
        : catalog.filter(p => p.category === activeFilter);

      if (!list.length) {
        projectsGroup.innerHTML = '<div class="empty-cat">Próximamente en esta categoría</div>';
        return;
      }

      projectsGroup.innerHTML = list.map(p => {
        const cls = p.accent === "red"
          ? "project-link htv-btn"
          : p.accent === "green"
            ? "project-link fund-btn"
            : "project-link";
        return `<a class="${cls}" href="${p.path}" title="${p.summary || p.title}">${p.title}</a>`;
      }).join("");
    }

    renderFilters();
    renderProjects();

    /* --- Bloque ASCII WHT mutante --- */
    const el = document.getElementById("whtAscii");

    const MATH_SYMBOLS = [
      "∫", "∑", "∂", "√", "σ", "μ", "λ", "Δ", "∇", "π", "∞", "ρ", "α", "β",
      "θ", "γ", "ν", "τ", "Φ", "z", "x", "y", "t", "δ", "ε", "ψ", "ω", "±", "≈", "≠"
    ];

    const PATTERN = [
      "11     11    11   11    111111111",
      "11     11    11   11       111   ",
      "11  1  11    1111111       111   ",
      "11 111 11    1111111       111   ",
      "111   111    11   11       111   ",
      "11     11    11   11       111   "
    ];

    const rows = PATTERN.length;
    const cols = PATTERN[0].length;

    const currentSymbols = [];
    for (let r = 0; r < rows; r++) {
      currentSymbols[r] = [];
      for (let c = 0; c < cols; c++) {
        currentSymbols[r][c] = MATH_SYMBOLS[Math.floor(Math.random() * MATH_SYMBOLS.length)];
      }
    }

    function renderAscii() {
      let output = "";
      for (let r = 0; r < rows; r++) {
        let line = "";
        for (let c = 0; c < cols; c++) {
          if (PATTERN[r][c] === "1") {
            if (Math.random() < 0.15) {
              currentSymbols[r][c] = MATH_SYMBOLS[Math.floor(Math.random() * MATH_SYMBOLS.length)];
            }
            line += currentSymbols[r][c];
          } else {
            line += " ";
          }
        }
        output += line + (r < rows - 1 ? "\n" : "");
      }
      el.textContent = output;
    }

    setInterval(renderAscii, 55);
    renderAscii();
  </script>
</body>
</html>
