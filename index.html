  <script>
    const el = document.getElementById("whtAscii");

    // Símbolos matemáticos cuantitativos de un solo carácter
    const MATH_SYMBOLS = [
      "∫", "∑", "∂", "√", "σ", "μ", "λ", "Δ", "∇", "π", "∞", "ρ", "α", "β",
      "θ", "γ", "ν", "τ", "Φ", "z", "x", "y", "t", "δ", "ε", "ψ", "ω", "±", "≈", "≠"
    ];

    // Matriz de caracteres para W H T en bloques nítidos y perfectamente legibles
    // 1 = celda donde va un símbolo matemático mutante
    // 0 = espacio vacío
    const PATTERN = [
      "11     11    11   11    111111111",
      "11     11    11   11       111   ",
      "11  1  11    1111111       111   ",
      "11 111 11    1111111       111   ",
      "111   111    11   11       111   ",
      "11     11    11   11       111   "
    ];

    const rows = PATTERN.length;
    const cols = PATTERN[0].length;

    // Estado de símbolos actuales para cada celda
    const currentSymbols = [];
    for (let r = 0; r < rows; r++) {
      currentSymbols[r] = [];
      for (let c = 0; c < cols; c++) {
        currentSymbols[r][c] = MATH_SYMBOLS[Math.floor(Math.random() * MATH_SYMBOLS.length)];
      }
    }

    function renderAscii() {
      let output = "";
      for (let r = 0; r < rows; r++) {
        let line = "";
        for (let c = 0; c < cols; c++) {
          if (PATTERN[r][c] === "1") {
            // Con probabilidad del 15% mutamos el símbolo en este frame para movimiento orgánico
            if (Math.random() < 0.15) {
              currentSymbols[r][c] = MATH_SYMBOLS[Math.floor(Math.random() * MATH_SYMBOLS.length)];
            }
            line += currentSymbols[r][c];
          } else {
            line += " ";
          }
        }
        output += line + (r < rows - 1 ? "\n" : "");
      }
      el.textContent = output;
    }

    // Mutación continua a ~20 FPS para un efecto visual fluido de cálculo cuántico
    setInterval(renderAscii, 55);
    renderAscii();
  </script>
